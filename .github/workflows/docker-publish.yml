name: Publish container images

on:
  workflow_call:
    inputs:
      component:
        description: "backend or web"
        required: true
        type: string
      version:
        description: "Version tag, e.g. 0.4.0"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      component:
        description: "backend or web"
        required: true
        type: choice
        options: [backend, web]
      version:
        description: "Version tag, e.g. 0.4.0"
        required: true
        type: string

# Each platform is built once and pushed by digest to every registry at the
# same time, then one manifest list is created per registry, so both carry the
# identical image. GHCR always receives it: the repository's own token is
# enough, which is what lets a fork publish under its owner's namespace with
# no setup. Docker Hub receives it only when DOCKERHUB_USERNAME /
# DOCKERHUB_TOKEN are configured, under that account's namespace.
permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve image names
        env:
          component: ${{ inputs.component }}
          platform: ${{ matrix.platform }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          # Both secrets or neither: a username alone would run the Docker Hub
          # login with an empty token and fail the job before the GHCR push.
          DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          images="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/auxilia-${component}"
          if [ "$DOCKERHUB_CONFIGURED" = "true" ]; then
            images="${DOCKERHUB_USERNAME}/auxilia-${component},${images}"
            echo "DOCKERHUB_ENABLED=true" >> "$GITHUB_ENV"
          fi
          echo "IMAGES=$images" >> "$GITHUB_ENV"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ inputs.component }}
          platforms: ${{ matrix.platform }}
          # `name` is a comma-separated list, so one build lands in every registry.
          outputs: type=image,"name=${{ env.IMAGES }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.component }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ inputs.component }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Resolve image names
        env:
          component: ${{ inputs.component }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          # Both secrets or neither: a username alone would run the Docker Hub
          # login with an empty token and fail the job before the GHCR push.
          DOCKERHUB_CONFIGURED: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          images="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/auxilia-${component}"
          if [ "$DOCKERHUB_CONFIGURED" = "true" ]; then
            images="${DOCKERHUB_USERNAME}/auxilia-${component},${images}"
            echo "DOCKERHUB_ENABLED=true" >> "$GITHUB_ENV"
          fi
          echo "IMAGES=$images" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.component }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_ENABLED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest lists
        working-directory: ${{ runner.temp }}/digests
        # `latest` follows `main`, never a branch. Release-please calls this
        # workflow from `main`, so a release still moves it; a manual dispatch
        # from a feature branch publishes its own tag and nothing else —
        # `docker-compose.yml` defaults to `${VERSION:-latest}`, so tagging it
        # from a branch would hand unreleased code to every plain `compose up`.
        # Derived from the ref rather than an input: a test build must not be
        # one forgotten checkbox away from overwriting the released image.
        env:
          VERSION: ${{ inputs.version }}
          IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
        run: |
          IFS=',' read -r -a images <<< "$IMAGES"
          for image in "${images[@]}"; do
            tags=(-t "$image:$VERSION")
            # An `if`, not `[ … ] && …`: steps run under `bash -e`, where the
            # test returning 1 on a branch build would fail the step outright.
            if [ "$IS_MAIN" = "true" ]; then
              tags+=(-t "$image:latest")
            fi
            sources=()
            for digest in *; do
              sources+=("$image@sha256:$digest")
            done
            docker buildx imagetools create "${tags[@]}" "${sources[@]}"
            docker buildx imagetools inspect "$image:$VERSION"
          done
