configs:
  opensandbox-config:
    content: |
      [server]
      host = "0.0.0.0"
      port = 8090

      [proxy]
      resolve_internal = false

      [runtime]
      type = "docker"
      execd_image = "opensandbox/execd:v1.1.0"

      [egress]
      image = "opensandbox/egress:v1.1.7"
      readiness_timeout_seconds = 30.0

      [docker]
      network_mode = "bridge"
      host_ip = "host.docker.internal"
      port_range_min = 40000
      port_range_max = 60000

services:
  opensandbox:
    image: opensandbox/server:release-1.1.0
    container_name: auxilia-opensandbox
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    configs:
      - source: opensandbox-config
        target: /etc/opensandbox/config.toml
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_INSECURE_SERVER: "YES"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - auxilia-network

  dbhub:
    image: bytebase/dbhub:1.5.0
    container_name: auxilia-dbhub
    init: true
    user: "1000:1000"
    environment:
      DBHUB_AUTH_TOKEN: ${DBHUB_AUTH_TOKEN:-change-me-in-development}
      DBHUB_ALLOWED_HOSTS: dbhub,dbhub:8080,localhost,localhost:8080,127.0.0.1,127.0.0.1:8080
    entrypoint: ["node", "/opt/auxilia/dbhub-reloader.mjs"]
    command:
      [
        "--transport",
        "http",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--config",
        "/tmp/dbhub.toml",
      ]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./.runtime/dbhub:/input:ro
      - ./.runtime/databases:/var/lib/auxilia/databases
      - ./docker/dbhub-reloader.mjs:/opt/auxilia/dbhub-reloader.mjs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - auxilia-network

  redis:
    image: redis:7-alpine
    container_name: auxilia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # Enable AOF persistence for durability
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - auxilia-network

  postgres:
    image: postgres:17
    container_name: auxilia-postgres
    restart: always
    # POSTGRES_* only initialize an empty volume. If DB_* changes later,
    # update the existing role/database explicitly or recreate the dev volume.
    environment:
      POSTGRES_USER: ${DB_USER:-auxilia}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-auxilia}
      POSTGRES_DB: ${DB_NAME:-auxilia}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 5
      timeout: 3s
    networks:
      - auxilia-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@auxilia.ai
      PGADMIN_DEFAULT_PASSWORD: auxilia
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - auxilia-network

networks:
  auxilia-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  postgres-data:
    driver: local
  pgadmin_data:
    driver: local
